name: Forward test

on:
  schedule:
    - cron: "23 1 * * 2-6"   # after each trading day (Mon-Fri), 01:23 UTC
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send a Telegram test message"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: forward-test
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Simulate the strategies on the latest prices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ inputs.test_telegram }}
        run: python forward/run_forward.py
      - name: Save results
        run: |
          git config user.name "forward-test"
          git config user.email "forward-test@users.noreply.github.com"
          git add forward/
          git diff --cached --quiet || git commit -m "Forward test update $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
